# POC only. Run through ./demo.sh, which bootstraps the join token and registration entries.
name: mcp-svid-auth

x-workload: &workload
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: mcp-svid-auth:local
  # Shared PID namespace so the agent sees workload PIDs and can map them to containers.
  pid: "service:spire-agent"
  volumes:
    - spire-sockets:/run/spire/sockets:ro
  environment:
    SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
  depends_on:
    - spire-agent

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.3@sha256:4082f30d3e0ddc4000a171392c4ea174345ee44d161ee917c70b97b2ecfba141
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server/server.conf:ro
    # The image runs as 1000:1000. A tmpfs owned by that UID holds the datastore; state is
    # discarded on down, which is fine for a demo.
    tmpfs:
      - /opt/spire/data/server:uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.3@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff
    command:
      - "-config"
      - "/opt/spire/conf/agent/agent.conf"
      - "-joinToken"
      - "${JOIN_TOKEN:-set-by-demo-sh}"
    # Root to read the Docker socket and /proc of workloads running under other UIDs.
    user: "0"
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      # The docker attestor inspects containers to read labels. ":ro" only stops the file being
      # replaced; the API behind it is full access. See docs/security.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.data/bundle.pem:/opt/spire/bootstrap/bundle.pem:ro
      - spire-sockets:/run/spire/sockets
    depends_on:
      spire-server:
        condition: service_healthy

  authz:
    <<: *workload
    labels:
      org.example.svid.workload: authz
    user: "1010"
    volumes:
      - spire-sockets:/run/spire/sockets:ro
      # demo.sh copies deploy/policy.yaml here; scenario 9 edits it while authz runs.
      - ./.data/policy:/policy:ro
    command:
      - mcp-svid-authz
      - --issuer=http://authz:8100
      - --policy=/policy/policy.yaml
      - --host=0.0.0.0
      - --port=8100
      # The SPIRE 1.15.3 agent caches JWT-SVIDs even with -jwtSVIDIncludeJTI, so a workload gets the
      # same SVID (same jti) on every fetch. Strict replay rejection would refuse the second token
      # request. Explicit opt-out; residual risk in docs/security.md.
      - --svid-replay=allow-reuse-within-lifetime

  notes-a:
    <<: *workload
    labels:
      org.example.svid.workload: notes-a
    user: "1011"
    command:
      - mcp-svid-notes
      - --name=notes-a
      - --resource=http://notes-a:8101/mcp
      - --issuer=http://authz:8100
      - --host=0.0.0.0
      - --port=8101
      # notes.search_upstream calls notes-b with notes-a's own token (scenario 8).
      - --upstream-resource=http://notes-b:8102/mcp
      - --trusted-issuer=http://authz:8100
      - --allow-http
      - --allow-private-network
    depends_on: [authz]

  notes-b:
    <<: *workload
    labels:
      org.example.svid.workload: notes-b
    user: "1012"
    command:
      - mcp-svid-notes
      - --name=notes-b
      - --resource=http://notes-b:8102/mcp
      - --issuer=http://authz:8100
      - --host=0.0.0.0
      - --port=8102
    depends_on: [authz]

  # Scenario 6: a resource whose Protected Resource Metadata names an authorization server the
  # agents do not trust. It never needs an SVID.
  notes-rogue:
    <<: *workload
    labels:
      org.example.svid.workload: notes-rogue
    user: "1013"
    profiles: [scenarios]
    command:
      - mcp-svid-notes
      - --name=notes-rogue
      - --resource=http://notes-rogue:8103/mcp
      - --issuer=http://rogue-as:8100
      - --host=0.0.0.0
      - --port=8103

  agent-research:
    <<: *workload
    labels:
      org.example.svid.workload: agent-research
    user: "1001"
    profiles: [agents]
    entrypoint: ["mcp-svid-agent"]

  agent-intruder:
    <<: *workload
    labels:
      org.example.svid.workload: agent-intruder
    user: "1002"
    profiles: [agents]
    entrypoint: ["mcp-svid-agent"]

  # Scenario 5: a different container that carries the agent-research label.
  agent-impostor:
    <<: *workload
    labels:
      org.example.svid.workload: agent-research
    user: "1003"
    profiles: [agents]
    entrypoint: ["mcp-svid-agent"]

volumes:
  spire-sockets:
