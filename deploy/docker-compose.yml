# POC only. Run through ./demo.sh, which bootstraps the join token and registration entries.
name: mcp-svid-auth

x-workload: &workload
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: mcp-svid-auth:local
  # Shared PID namespace so the agent's unix attestor can inspect workload processes.
  pid: "service:spire-agent"
  volumes:
    - spire-sockets:/run/spire/sockets:ro
  environment:
    SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
  depends_on:
    - spire-agent

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.3@sha256:4082f30d3e0ddc4000a171392c4ea174345ee44d161ee917c70b97b2ecfba141
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server/server.conf:ro
    # The image runs as 1000:1000. A tmpfs owned by that UID holds the datastore; state is
    # discarded on down, which is fine for a demo.
    tmpfs:
      - /opt/spire/data/server:uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.3@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff
    command:
      - "-config"
      - "/opt/spire/conf/agent/agent.conf"
      - "-joinToken"
      - "${JOIN_TOKEN:-set-by-demo-sh}"
    # Root so the unix attestor can read /proc of workloads running under other UIDs.
    user: "0"
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./.data/bundle.pem:/opt/spire/bootstrap/bundle.pem:ro
      - spire-sockets:/run/spire/sockets
    depends_on:
      spire-server:
        condition: service_healthy

  authz:
    <<: *workload
    user: "1010"
    command:
      - mcp-svid-authz
      - --issuer=http://authz:8100
      - --policy=/app/deploy/policy.yaml
      - --host=0.0.0.0
      - --port=8100

  notes-a:
    <<: *workload
    user: "1011"
    command:
      - mcp-svid-notes
      - --name=notes-a
      - --resource=http://notes-a:8101/mcp
      - --issuer=http://authz:8100
      - --host=0.0.0.0
      - --port=8101
    depends_on: [authz]

  notes-b:
    <<: *workload
    user: "1012"
    command:
      - mcp-svid-notes
      - --name=notes-b
      - --resource=http://notes-b:8102/mcp
      - --issuer=http://authz:8100
      - --host=0.0.0.0
      - --port=8102
    depends_on: [authz]

  agent-research:
    <<: *workload
    user: "1001"
    profiles: [agents]
    entrypoint: ["mcp-svid-agent"]

  agent-intruder:
    <<: *workload
    user: "1002"
    profiles: [agents]
    entrypoint: ["mcp-svid-agent"]

volumes:
  spire-sockets:
