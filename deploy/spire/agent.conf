agent {
  data_dir = "/opt/spire/data/agent"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/run/spire/sockets/agent.sock"
  trust_bundle_path = "/opt/spire/bootstrap/bundle.pem"
  trust_domain = "example.org"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "memory" {
    plugin_data {}
  }
  # UID based. Any process running as a registered UID gets that identity. Weak, POC only.
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
