[project]
site_name = "mcp-svid-auth"
site_description = "Proof of concept: SPIFFE JWT-SVIDs as OAuth client credentials for MCP servers"
site_author = "Tanya Babitskaya"
site_url = "https://tanya-ok.github.io/mcp-svid-auth/"
copyright = "Copyright &copy; 2026 Tanya Babitskaya. Apache-2.0."
repo_url = "https://github.com/tanya-ok/mcp-svid-auth"
repo_name = "tanya-ok/mcp-svid-auth"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/overview.css"]

nav = [
  { "Home" = "index.md" },
  { "Start locally" = "quickstart.md" },
  { "Architecture" = "architecture.md" },
  { "Demo" = "demo.md" },
  { "Security and reference" = [
  { "Security model" = "security.md" },
  { "Threat model" = "threat-model.md" },
  { "Compatibility" = "compatibility.md" },
  { "Configuration" = "configuration.md" },
  { "Audit integrity" = "audit.md" },
  { "stdio wrapper" = "stdio-wrapper.md" },
  { "Public standards" = "references.md" },
] },
  { "Lab guides" = [
  { "CNCF runtime" = "runtime.md" },
  { "Kubernetes lab" = "kubernetes-lab.md" },
  { "Headlamp" = "headlamp-ui.md" },
  { "ZITADEL / Human identity" = "passwordless-identity.md" },
] },
  { "Development and evidence" = [
  { "Publication validation" = "publication.md" },
  { "Portfolio readiness" = "portfolio-publication-readiness.md" },
  { "Development plan" = "development-plan.md" },
  { "Portfolio plan" = "portfolio-development-plan.md" },
  { "Review quorum" = "quorum.md" },
  { "Engineering OS integration" = "engineering-os-integration.md" },
  { "Quorum implementation evidence" = "quorum-implementation-2026-10-07.md" },
  { "Six-project review" = "portfolio-quorum-2026-10-07.md" },
  { "Dated evidence" = [
    { "Cost budgets and rotation" = "auth-cost-rotation.md" },
    { "Portfolio checkpoint 2026-10-07" = "portfolio-checkpoint-2026-10-07.md" },
    { "Quorum validation" = "quorum-validation.md" },
  ] },
] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/tanya-ok/mcp-svid-auth"

[project.markdown_extensions]
pymdownx.tasklist.custom_checkbox = true
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
