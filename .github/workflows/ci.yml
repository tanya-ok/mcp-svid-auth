name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Config docs drift check
        run: uv run python scripts/gen_config_docs.py --check
      - run: uv run pytest -q
      - name: Headlamp namespace regression checks
        run: node --test tests/headlamp-settings.test.mjs
      - name: Build and inspect publication artifacts
        run: make package
      - name: Install independent MCP client
        working-directory: examples/typescript-client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check independent MCP client
        run: make interop
