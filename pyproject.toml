[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-svid-auth"
version = "0.1.0"
description = "Proof of concept: SPIFFE JWT-SVIDs as OAuth client credentials for MCP servers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Tanya Babitskaya" }]
keywords = ["spiffe", "spire", "jwt-svid", "oauth", "mcp", "workload-identity", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=50,<51",
    "httpx2>=2.13.1,<3",
    "mcp>=2.2,<3",
    "pyjwt[crypto]>=2.15.0,<3",
    "pyyaml>=6.0.3,<7",
    "spiffe>=0.3.2,<0.4",
    "starlette>=1.7.0,<2",
    "uvicorn>=0.54.0,<1",
]

[project.urls]
Homepage = "https://tanya-ok.github.io/mcp-svid-auth/"
Documentation = "https://tanya-ok.github.io/mcp-svid-auth/"
Source = "https://github.com/tanya-ok/mcp-svid-auth"
Issues = "https://github.com/tanya-ok/mcp-svid-auth/issues"

[project.scripts]
mcp-svid-authz = "mcp_svid_auth.authz:main"
mcp-svid-notes = "mcp_svid_auth.mcp_server:main"
mcp-svid-agent = "mcp_svid_auth.agent_client:main"
mcp-svid-stdio = "mcp_svid_auth.stdio_wrapper:main"
mcp-svid-audit-verify = "mcp_svid_auth.audit:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "mypy>=1.16,<3",
    "types-pyyaml>=6.0.12.20260906,<7",
]
docs = [
    "zensical>=0.0.65,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_svid_auth"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.beads",
    "/.data",
    "/.venv-docs",
    "/site",
    "/tests/denylist.txt",
    "/deploy/.data",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "N", "PTH", "C4"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
